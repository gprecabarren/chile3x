packages:
  - '.'

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

# Security fixes for dependencies pinned by the existing tooling. Keep these
# parent/version-scoped so unrelated consumers retain supported dependency ranges.
overrides:
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  'wrangler>esbuild': 0.28.1
  'miniflare>undici': 7.29.1
  'miniflare>ws': 8.21.0
  '@cloudflare/vite-plugin>ws': 8.21.0
  'miniflare>sharp': 0.35.5
  'ajv>fast-uri': 3.1.8
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'postcss>nanoid': 3.3.18
  'vinext>image-size': 2.0.3
  'postcss>source-map-js': 1.2.2
